# Exercise 2: both pods are Running and Ready, but the Service sends traffic nowhere.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: broken
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: traefik/whoami:v1.10.3
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: broken
spec:
  selector:
    app: apl
  ports:
    - port: 80
      targetPort: 80
