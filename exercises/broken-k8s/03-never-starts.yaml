# Exercise 3: the pod never starts. Read the events, not just the status.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: broken
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpnie
          ports:
            - containerPort: 6379
