# Exercise 4: the pod is Running, never Ready, and gets no traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: broken
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: traefik/whoami:v1.10.3
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
